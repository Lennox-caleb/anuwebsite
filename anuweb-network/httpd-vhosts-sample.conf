# ============================================================
# Sample httpd-vhosts.conf entries for the ANU website network
# ============================================================
# File location:
#   Windows: C:\xampp\apache\conf\extra\httpd-vhosts.conf
#   Mac:     /Applications/XAMPP/xamppfiles/etc/extra/httpd-vhosts.conf
#
# 1. Make sure vhosts are enabled in httpd.conf: find the line
#      #Include etc/extra/httpd-vhosts.conf
#    and remove the leading "#" if present.
#
# 2. Append everything below to httpd-vhosts.conf, editing the
#    DocumentRoot / Directory paths to match where you unzipped
#    the project (this example assumes C:\xampp\htdocs\anuweb-network\...).
#
# 3. Restart Apache from the XAMPP Control Panel after saving.
# ============================================================

<VirtualHost *:80>
    ServerName anuweb.local
    DocumentRoot "C:/xampp/htdocs/anuweb-network/main-site"
    <Directory "C:/xampp/htdocs/anuweb-network/main-site">
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

